; ScholarNest queue worker — Supervisor program definition.
;
; Document extraction runs on the queue so the browser is never left waiting on
; a 20MB PDF. That only works if something is running the queue, and a worker
; started by hand in an SSH session is not that: it dies with the session, and
; nothing restarts it after a reboot or a crash. Uploads then sit at "Pending"
; forever, which looks to a teacher exactly like a broken upload.
;
; Install (Ubuntu/Debian):
;
;   sudo apt-get install -y supervisor
;   sudo cp deploy/supervisor/scholarnest-worker.conf /etc/supervisor/conf.d/
;   sudo sed -i 's#/var/www/scholarnest#/actual/path/to/app#' /etc/supervisor/conf.d/scholarnest-worker.conf
;   sudo sed -i 's#user=www-data#user=YOUR_WEB_USER#' /etc/supervisor/conf.d/scholarnest-worker.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start scholarnest-worker:*
;
; Check it:
;
;   sudo supervisorctl status scholarnest-worker:*
;
; After every deployment, tell the running workers to pick up the new code -
; queue:work holds the application in memory and will otherwise keep running
; the version it booted with:
;
;   php artisan queue:restart

[program:scholarnest-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/scholarnest

; --max-time recycles each worker hourly, which caps the effect of any slow
; leak in a long-running PHP process.
;
; --timeout must stay below the job's own timeout (300s in the extraction jobs)
; so the job records its own failure rather than being killed mid-write.
;
; --tries matches the jobs' retry count; the backoff is defined in the job.
command=php artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=280 --max-time=3600

autostart=true
autorestart=true

; Restarting is normal here: --max-time makes the worker exit on purpose.
startretries=10
startsecs=5

; Match the user that owns storage/, or the worker will write logs and
; extracted images the web server cannot read.
user=www-data

; Two workers: enough for several teachers uploading at once without letting a
; burst of large PDFs monopolise the server's CPU.
numprocs=2

redirect_stderr=true
stdout_logfile=/var/www/scholarnest/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

; Give a worker time to finish the document it is on before it is killed during
; a deploy or restart.
stopwaitsecs=300
stopasgroup=true
killasgroup=true

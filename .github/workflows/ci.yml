name: CI

# Every push to a long-lived branch, and every pull request aimed at one.
# Nothing merges into main without this being green, see docs/GITHUB.md for
# the branch protection rule that enforces it, which is a repository setting
# and cannot live in this file.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A second push to the same branch cancels the run still going for the first.
# The older run is answering a question nobody is asking any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pint and the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # 8.2 is what composer.json requires and what the project is developed
      # on. When PHP 8.3 becomes the floor, change it here and in composer.json
      # together, a CI that tests a version nobody runs proves nothing.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # gd re-encodes uploaded images, zip reads .docx, sqlite is what the
          # suite runs against, intl is pulled in by the framework.
          extensions: mbstring, gd, zip, intl, bcmath, dom, xml, sqlite3, pdo_sqlite, fileinfo, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Refuse known-vulnerable dependencies
        run: composer audit

      - name: Check formatting
        run: vendor/bin/pint --test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Composer's dependencies are already audited above; the front end's
      # were not, which meant half the supply chain was being watched. High
      # and critical only: npm reports advisories against build-time packages
      # that never reach a browser, and a job that cries wolf gets ignored or
      # deleted rather than fixed.
      - name: Refuse known-vulnerable JavaScript dependencies
        run: npm audit --audit-level=high

      # Not optional. Feature tests render Blade views, those views call @vite,
      # and @vite throws without a build manifest, so skipping this fails the
      # suite in a way that looks nothing like a missing asset build.
      - name: Build assets
        run: npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs against sqlite in memory (see phpunit.xml), so there is
      # no database service to stand up here. The mysql job below runs the
      # same suite against the database production actually uses.
      - name: Run the test suite
        run: php artisan test

  mysql:
    name: The test suite on MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # THIS JOB EXISTS BECAUSE SQLITE HID A 500 FROM US.
    #
    # Every result page in production answered 500 for weeks, on a query
    # reading "SUM(MAX(amount - paid, 0))". A two-argument MAX() is SQLite's
    # and only SQLite's; MySQL has MAX() as an aggregate taking one argument,
    # so it was a syntax error on every real request and a passing test on
    # every run of the suite. Nothing in the code looked wrong, and nothing
    # could have: the test database answered differently from the real one.
    #
    # The same gap hides more than that one function. SQLite does not enforce
    # string lengths, so a value too long for its column writes cleanly here
    # and truncates or errors there; it is lenient about GROUP BY, where
    # MySQL's ONLY_FULL_GROUP_BY refuses; and its date and boolean handling
    # is looser. Each of those is a 500 that a green suite would wave through.
    #
    # So the suite runs twice. Sqlite above, because it is fast and it is what
    # a developer runs locally. MySQL here, because it is what answers a
    # parent checking their child's result.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: akademicnest_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, gd, zip, intl, bcmath, dom, xml, mysqli, pdo_mysql, fileinfo, curl
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      # Same reason as the job above: feature tests render views, and @vite
      # throws without a build manifest.
      - name: Build assets
        run: npm run build

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Passed as real environment variables, which phpunit.xml's <env> entries
      # do not override, so the suite connects here instead of to sqlite.
      #
      # config/database.php sets strict mode on this connection, which is what
      # brings ONLY_FULL_GROUP_BY and the zero-date rules with it. Relaxing it
      # to make a test pass would give this job away for nothing.
      - name: Run the test suite against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: akademicnest_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
